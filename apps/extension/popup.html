<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0A0A0A;
      color: #E5E7EB;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .logo {
      width: 24px;
      height: 24px;
      background: #2563EB;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      font-family: monospace;
      color: white;
    }
    textarea {
      width: 100%;
      height: 120px;
      background: #121212;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 12px;
      color: white;
      font-size: 14px;
      resize: none;
      box-sizing: border-box;
      margin-bottom: 12px;
      outline: none;
    }
    textarea:focus {
      border-color: #3B82F6;
    }
    button {
      width: 100%;
      background: #2563EB;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #1D4ED8;
    }
    button:disabled {
      background: #374151;
      cursor: not-allowed;
    }
    .status {
      font-size: 12px;
      text-align: center;
      margin-top: 12px;
      height: 16px;
    }
    .success { color: #10B981; }
    .error { color: #EF4444; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">✱</div>
    <div style="font-weight: 600; font-size: 16px;">grafz™</div>
  </div>
  
  <textarea id="content" placeholder="Type or paste something to remember..."></textarea>
  <button id="saveBtn">Save to Memory</button>
  <div id="status" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
